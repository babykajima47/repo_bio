# Tiện ích cho dev/test local — Vibe Host khi deploy thật sẽ tự cấp MySQL riêng
# và tiêm biến DB_* qua envMapping, không dùng file này.
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe123!
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: vn_biolink_hub
      DB_USERNAME: biolink
      DB_PASSWORD: biolink_secret
    volumes:
      - uploads_data:/var/www/html/public/uploads
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: vn_biolink_hub
      MYSQL_USER: biolink
      MYSQL_PASSWORD: biolink_secret
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  uploads_data:
